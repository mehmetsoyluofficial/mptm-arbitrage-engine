name: Cross Exchange Research

on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare public Kraken and Coinbase books
        run: python cross_exchange.py
      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-exchange-${{ github.run_id }}
          path: cross_exchange_results.json
          if-no-files-found: ignore
          retention-days: 3
