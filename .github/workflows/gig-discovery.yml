name: Paid AI Gig Discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '16 7,19 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python gig_discovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-gig-candidates-${{ github.run_id }}
          path: gig_candidates.json
          if-no-files-found: ignore
          retention-days: 7
